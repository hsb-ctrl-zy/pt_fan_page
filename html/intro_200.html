<!-- 각 내용을 탭으로 구분 -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코코롱의 코코리움</title>
    <style>
        /* 온글잎 박다현체 @font-face */
        @font-face {
            font-family: 'OngleipParkDahyeon';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-sky: #C2E9FB;
            --bg-lavender: #E0C3FC;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #555;
            --pastel-pink: #FFB6C1;
            --pastel-blue: #ADD8E6;
            --pastel-purple: #DCD0FF;
            --logo-purple: #FF9EE2; /* 이미지의 글자 입체 보라색 추출 */
            --logo-purple-shadow: #ffffff;
            --tier-s: #FFD700;
            --tier-a: #C0C0C0;
            --tier-b: #CD7F32;
            --main-font: 'OngleipParkDahyeon', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--main-font);
            background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-lavender) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        /* 이미지 추출 보라색 적용 */
        header h1 {
            margin: 0 0 15px 0;
            color: var(--logo-purple);
            text-shadow: 2px 2px 0px var(--logo-purple-shadow);
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 20px;
            transition: background 0.3s;
            font-size: 1.1rem;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            background-color: #fff;
            color: #888;
        }

        main {
            width: 90%;
            max-width: 1200px;
            padding: 40px 0;
        }

        /* 탭 섹션 전환 제어 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* 카드 스타일 */
        .card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 2px dashed #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* 캘린더 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .cal-day { font-size: 0.9rem; color: #888; font-weight: bold; }
        .cal-date { padding: 8px; border-radius: 50%; background: #f9f9f9; cursor: pointer; font-size: 1rem; }
        .cal-date:hover { background: var(--pastel-blue); }
        .has-event { background: var(--pastel-pink); color: white; }

        /* 이벤트 로그 */
        .log-item {
            display: flex;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .log-item.new { border-left: 4px solid var(--pastel-pink); }
        .d-day { color: #ff6b81; font-weight: bold; }

        /* 가챠 시뮬레이터 */
        .gacha-display {
            width: 100%;
            height: 120px;
            background: #eee;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #aaa;
            overflow: hidden;
        }
        .gacha-display.sr { background: var(--tier-s); color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .gacha-display.r { background: var(--tier-a); color: white; }
        .gacha-display.n { background: #fff; color: #555; }

        .btn-draw {
            width: 100%;
            padding: 12px;
            background: var(--pastel-pink);
            border: none;
            border-radius: 20px;
            color: white;
            font-family: var(--main-font);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-draw:hover { box-shadow: 0 4px 10px rgba(255,182,193,0.5); }
        .btn-draw:active { transform: scale(0.98); }

        /* 티어 리스트 */
        .tier-container { display: flex; flex-direction: column; gap: 8px; }
        .tier-row { display: flex; align-items: center; background: #fff; border-radius: 12px; min-height: 50px; padding: 5px; border: 1px solid #eee;}
        .tier-label { width: 40px; height: 40px; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.2rem; font-weight: bold; margin-right: 10px; }
        .label-s { background: var(--tier-s); }
        .label-a { background: var(--tier-a); }
        .label-b { background: var(--tier-b); }
        
        .tier-items { flex: 1; display: flex; gap: 5px; min-height: 40px; }
        
        .item-pool { margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 12px; display: flex; gap: 8px; flex-wrap: wrap;}
        .item { width: 45px; height: 45px; background: var(--pastel-purple); border-radius: 10px; cursor: grab; display: flex; justify-content: center; align-items: center; color: white; font-size: 0.9rem;}
        .item:active { cursor: grabbing; opacity: 0.7; }

        /* 홈 전용 안내 문구 스타일 */
        .home-welcome {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }
        .home-welcome h2 {
            border-bottom: none;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>코코롱의 코코리움 - 포켓트윈 팬페이지</h1>
        <nav>
            <ul>
                <li><a class="nav-btn active" onclick="openTab(event, 'tab-home')">홈</a></li>
                <li><a class="nav-btn" onclick="openTab(event, 'tab-calendar')">캘린더</a></li>
                <li><a class="nav-btn" onclick="openTab(event, 'tab-gacha')">가챠 시뮬레이터</a></li>
                <li><a class="nav-btn" onclick="openTab(event, 'tab-tier')">티어 리스트</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 1. 홈 (비워둔 상태) -->
        <div id="tab-home" class="tab-content active">
            <div class="card home-welcome">
                <h2>환영합니다!</h2>
                <p>상단 메뉴를 클릭하여 원하는 기능을 이용해 보세요.</p>
            </div>
        </div>

        <!-- 2. 캘린더 탭 (이벤트 캘린더 + 이벤트 로그) -->
        <div id="tab-calendar" class="tab-content">
            <div class="card calendar">
                <h2>이벤트 캘린더</h2>
                <div class="calendar-grid">
                    <div class="cal-day">일</div><div class="cal-day">월</div><div class="cal-day">화</div><div class="cal-day">수</div><div class="cal-day">목</div><div class="cal-day">금</div><div class="cal-day">토</div>
                    <div class="cal-date">1</div><div class="cal-date has-event">2</div><div class="cal-date">3</div><div class="cal-date">4</div><div class="cal-date">5</div><div class="cal-date has-event">6</div><div class="cal-date">7</div>
                    <div class="cal-date">8</div><div class="cal-date">9</div><div class="cal-date">10</div><div class="cal-date">11</div><div class="cal-date">12</div><div class="cal-date">13</div><div class="cal-date">14</div>
                </div>
            </div>

            <div class="card event-log">
                <h2>이벤트 로그 (+3일)</h2>
                <div class="log-item new">
                    <span>[가챠] 파스텔 엔젤</span>
                    <span class="d-day">D+1</span>
                </div>
                <div class="log-item">
                    <span>[미션] 체리 수집 주간</span>
                    <span class="d-day">D+3</span>
                </div>
                <div class="log-item">
                    <span>[복각] 고스 룩 테마</span>
                    <span>종료</span>
                </div>
            </div>
        </div>

        <!-- 3. 가챠 시뮬레이터 탭 -->
        <div id="tab-gacha" class="tab-content">
            <div class="card gacha">
                <h2>가챠 시뮬레이터</h2>
                <div class="gacha-display" id="gachaDisplay">뽑기를 진행하세요</div>
                <button class="btn-draw" onclick="drawGacha()">1회 뽑기 (도넛 100개)</button>
            </div>
        </div>

        <!-- 4. 티어 리스트 메이커 탭 -->
        <div id="tab-tier" class="tab-content">
            <div class="card tier-list">
                <h2>티어 리스트 메이커</h2>
                <div class="tier-container">
                    <div class="tier-row"><div class="tier-label label-s">S</div><div class="tier-items" ondrop="drop(event)" ondragover="allowDrop(event)"></div></div>
                    <div class="tier-row"><div class="tier-label label-a">A</div><div class="tier-items" ondrop="drop(event)" ondragover="allowDrop(event)"></div></div>
                    <div class="tier-row"><div class="tier-label label-b">B</div><div class="tier-items" ondrop="drop(event)" ondragover="allowDrop(event)"></div></div>
                </div>
                <div class="item-pool" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="item" draggable="true" ondragstart="drag(event)" id="item1">윙크</div>
                    <div class="item" draggable="true" ondragstart="drag(event)" id="item2">헤어</div>
                    <div class="item" draggable="true" ondragstart="drag(event)" id="item3">안대</div>
                    <div class="item" draggable="true" ondragstart="drag(event)" id="item4">원피스</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /* 탭 전환 기능 */
        function openTab(evt, tabId) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) {
                contents[i].classList.remove("active");
            }

            const buttons = document.getElementsByClassName("nav-btn");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }

            document.getElementById(tabId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        /* 가챠 로직 */
        function drawGacha() {
            const display = document.getElementById('gachaDisplay');
            const rand = Math.random() * 100;
            let result = '';
            let grade = '';

            if (rand < 3) {
                result = '★SR★';
                grade = 'sr';
            } else if (rand < 18) {
                result = '♪ R ♪';
                grade = 'r';
            } else {
                result = 'N';
                grade = 'n';
            }

            display.textContent = result;
            display.className = 'gacha-display ' + grade;
        }

        /* 드래그 앤 드롭 로직 */
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            if (ev.target.classList.contains('tier-items') || ev.target.classList.contains('item-pool')) {
                ev.target.appendChild(document.getElementById(data));
            }
        }
    </script>
</body>
</html>
